name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm build-essential libelf-dev libssl-dev zlib1g-dev
          sudo bash scripts/install-bpftool.sh
          bpftool version

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: Build eBPF programs
        run: make build-ebpf

      - name: Build Go binaries
        run: |
          make build-rootkit
          make build-client
          make build-webapp

      - name: Check Docker build
        run: docker build --tag kubedagger:ci .

      - name: Vet
        run: go vet ./...

      - name: Runner environment info
        run: |
          uname -a
          cat /proc/sys/vm/memfd_noexec 2>/dev/null || echo "vm.memfd_noexec: not present"
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true

      - name: Test (race detector)
        run: go test -race -count=1 -timeout 120s ./...

      - name: Test with coverage
        run: make test-cover

      - name: Integration Test
        run: sudo $(which go) test -tags integration -v -count=1 -timeout 60s ./pkg/kubedagger/

      - name: Lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: v1.64.8
          install-mode: goinstall
          # The config schema fetch from golangci-lint.run is a network
          # dependency outside our control; the config is stable and valid.
          verify: false
