name: Detection rules

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      - name: Install Python validators
        run: |
          python3 -m venv .venv-detections
          .venv-detections/bin/python -m pip install -r scripts/detections/requirements.txt
      - name: Compile rules and check event fixtures
        env:
          PYTHON: .venv-detections/bin/python
        run: make test-detections
