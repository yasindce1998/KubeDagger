# KubeDagger lab stand-in targets.
#
# Each stand-in mimics the exact deployment signature (namespace + label
# selector) that a pkg/cloudevasion detect* function matches, so detection
# and evasion workflows can be exercised against a live kind cluster without
# installing actual security products. Every stand-in is a lightweight busybox
# pod running `sleep infinity` — no security product actually runs here.
#
# The generic detection name triggered by each block is noted in its comment.
# See docs/LAB.md for the full resource -> detection mapping.

---
# cnative-sensor (detectCnativeSensor): namespace "falco", label app=falco
apiVersion: v1
kind: Namespace
metadata:
  name: falco
---
apiVersion: v1
kind: Pod
metadata:
  name: falco-sensor-standin
  namespace: falco
  labels:
    app: falco
    kubedagger.lab/standin: "true"
spec:
  containers:
    - name: standin
      image: busybox:1.36
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi

